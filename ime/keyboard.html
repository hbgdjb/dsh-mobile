<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <title>DSH 键盘</title>
    <!--
      只引 tokens.css（纯变量，无选择器污染）。
      刻意不引 base.css：它带 .stage / .device 那套桌面预览壳，
      在 360×290 的键盘窗口里会多出一个设备边框。
      reset 在这里自己写，只需要几条。
    -->
    <link rel="stylesheet" href="../styles/tokens.css" />
    <link rel="stylesheet" href="./ime.css" />
  </head>
  <body>
    <!--
      注意：这一页**绝不能**出现 input / textarea / contenteditable。
      键盘自己的 WebView 一旦有可聚焦的输入元素，就会抢走输入焦点，
      表现为"点了键盘没反应"或者无限递归唤起。
    -->
    <div class="kb" id="kb">
      <!-- 候选条 -->
      <div class="bar" id="bar">
        <div class="bar__cands" id="cands"></div>
        <button class="bar__more" id="more" type="button" aria-label="更多候选">›</button>
      </div>

      <!-- 工具条 -->
      <div class="tools" id="tools">
        <!--
          图标用内联 SVG，不用 emoji。
          emoji 依赖系统字体：国产 ROM 上经常渲染成方框，
          而输入法是最不能"看起来坏了"的地方。
        -->
        <button class="tool" type="button" data-tool="voice" aria-label="语音输入">
          <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0"/><path d="M12 18v3"/></svg>
          <span class="tool__txt">语音</span>
        </button>
        <button class="tool" type="button" data-tool="hand" aria-label="手写输入">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20l4-1 9.5-9.5a2.1 2.1 0 0 0-3-3L5 16z"/><path d="M13.5 7.5l3 3"/></svg>
          <span class="tool__txt">手写</span>
        </button>
        <button class="tool" type="button" data-tool="ai" aria-label="AI 改写">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3l1.9 5.6L19.5 10l-5.6 1.4L12 17l-1.9-5.6L4.5 10l5.6-1.4z"/><path d="M18 15l.9 2.6 2.6.9-2.6.9L18 22l-.9-2.6-2.6-.9 2.6-.9z"/></svg>
          <span class="tool__txt">改写</span>
        </button>
        <button class="tool" type="button" data-tool="phrase" aria-label="快捷短语">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14a3 3 0 0 1-3 3H9l-5 4v-5a3 3 0 0 1-1-2V7a3 3 0 0 1 3-3h11a3 3 0 0 1 3 3z"/></svg>
          <span class="tool__txt">短语</span>
        </button>
        <button class="tool" type="button" data-tool="clip" aria-label="剪贴板">
          <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="8" y="3" width="8" height="4" rx="1"/><path d="M16 5h2a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V7a2 2 0 0 1 2-2h2"/></svg>
          <span class="tool__txt">剪贴</span>
        </button>
        <button class="tool" type="button" data-tool="capture" aria-label="截图">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 8h3l2-3h8l2 3h3v11H3z"/><circle cx="12" cy="13" r="3.4"/></svg>
          <span class="tool__txt">截图</span>
        </button>
      </div>

      <!-- 键区 -->
      <div class="keys" id="keys"></div>

      <!-- 面板：盖住键区 -->
      <div class="panel" id="panel" hidden>
        <div class="panel__head">
          <strong id="panel-title">面板</strong>
          <button class="panel__close" id="panel-close" type="button" aria-label="关闭">✕</button>
        </div>
        <div class="panel__body" id="panel-body"></div>
      </div>

      <!-- 提示条 -->
      <div class="toast" id="toast" hidden></div>
    </div>

    <script type="module" src="./main.js"></script>
  </body>
</html>
